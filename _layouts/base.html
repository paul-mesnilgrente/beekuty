<!doctype html>
<html lang="fr"{% if page.url == '/' %} class="home-html"{% endif %}>
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" href="favicon.ico" >
    <link rel="icon" type="image/gif" href="animated_favicon1.gif" >

    <!-- Polices : préchargées car utilisées dès le premier rendu (titres + navigation) -->
    <link rel="preload" href="/assets/fonts/unicorns_are_awesome.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/tahu.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" type="text/css" href="/assets/css/index.css">

    {% if page.url == '/' %}
      <link rel="preload" as="image" href="/assets/images/hand_logo.webp" fetchpriority="high">
    {% endif %}

    {% if page.lightbox %}
      <!-- lightbox: https://lokeshdhakar.com/projects/lightbox2/ -->
      <link href="/assets/lightbox2-2.11.4/css/lightbox.min.css" rel="stylesheet">
    {% endif %}

    <title>{{ page.title }} | Bee Kuty</title>
  </head>
  <body{% if page.url == '/' %} class="home-body"{% endif %}>
    {{ content }}

    {% if page.masonry %}
      <!-- Masonry: auto-initialised on elements with data-masonry -->
      <script src="/assets/js/masonry.pkgd.min.js" defer></script>
    {% endif %}

    {% if page.lightbox %}
      <!-- lightbox: https://lokeshdhakar.com/projects/lightbox2/ -->
      <script src="/assets/lightbox2-2.11.4/js/lightbox-plus-jquery.min.js" defer></script>
    {% endif %}
  </body>
</html>
