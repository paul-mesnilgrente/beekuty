# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: BeeKuty
email: karolanne.pelosato@gmail.com
tagline: Institut de beauté et prothésie ongulaire
description: >- # this means to ignore newlines until "baseurl:"
  BeeKuty, institut de beauté : manucure, pose de gel, nail art, épilation,
  soins du visage, beauté du regard et maquillage. Découvrez les prestations,
  les tarifs et la galerie de réalisations.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://beekuty.fr" # the base hostname & protocol for your site
lang: fr

# TODO (SEO local, étape 2) : renseigner l'adresse, le téléphone et les horaires.
# Ils alimenteront le balisage JSON-LD, le pied de page et les titres localisés
# ("Manucure à <ville>"), qui sont volontairement laissés sans ville pour l'instant.

# Réseaux sociaux — utilisés par jekyll-seo-tag pour le balisage `sameAs`
social:
  name: BeeKuty
  links:
    - https://www.instagram.com/beekuty47/
    - https://www.facebook.com/profile.php?id=61566957219807

# Image par défaut pour les partages Facebook / WhatsApp / LinkedIn.
# Passée par `defaults` : jekyll-seo-tag ne lit `image` que sur la page.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# Build settings
markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  sourcemap: never

exclude:
- README.md
- Gemfile
- Gemfile.lock
- node_modules
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
- scripts
- .env
- .github
# Sources non minifiées de lightbox2 : inutiles en production
- assets/lightbox2-2.11.4/css/lightbox.css
- assets/lightbox2-2.11.4/js/lightbox.js
# Variante sans jQuery : le site charge lightbox-plus-jquery.min.js
- assets/lightbox2-2.11.4/js/lightbox.min.js
- assets/lightbox2-2.11.4/js/lightbox.min.map
- assets/lightbox2-2.11.4/js/lightbox-plus-jquery.js
- assets/lightbox2-2.11.4/js/lightbox-plus-jquery.min.map
- assets/lightbox2-2.11.4/.github
- assets/lightbox2-2.11.4/.editorconfig
- assets/lightbox2-2.11.4/.gitignore
- assets/lightbox2-2.11.4/.jscsrc
- assets/lightbox2-2.11.4/.jshintrc
# Sources des polices : conservées dans le dépôt, seul le WOFF2 est servi
- assets/fonts/tahu.ttf
- assets/fonts/unicorns_are_awesome.otf
- assets/fonts/unicorns_are_awesome.ttf
